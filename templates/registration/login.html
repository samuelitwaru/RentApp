{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h4 mb-3 text-center">Log in</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">{{ form.username.label }}</label>
        {{ form.username.errors }}
        <input type="text" name="username" class="form-control" autofocus required id="id_username">
      </div>
      <div class="mb-3">
        <label class="form-label">{{ form.password.label }}</label>
        {{ form.password.errors }}
        <input type="password" name="password" class="form-control" required id="id_password">
      </div>
      {% for error in form.non_field_errors %}<div class="text-danger small mb-2">{{ error }}</div>{% endfor %}
      <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
