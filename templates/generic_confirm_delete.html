{% extends "base.html" %}
{% block title %}Delete {{ object }}{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Delete {{ object }}?</h1>
<p>This cannot be undone.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Delete</button>
  <a href="{{ cancel_url|default:'javascript:history.back()' }}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
