{% extends "base.html" %}
{% block title %}Generate access link{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Generate access link for {{ tenant.full_name }}</h1>
<form method="post" novalidate>
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
    </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">Generate link</button>
  <a href="{% url 'tenant_detail' tenant.pk %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
