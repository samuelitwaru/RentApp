{% extends "base.html" %}
{% load currency %}
{% block title %}Expenses by category{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">Expenses by category</h1>
  <a href="?{{ request.GET.urlencode }}&export=csv" class="btn btn-outline-secondary btn-sm">Export CSV</a>
</div>
<form method="get" class="row g-2 mb-3">
  <div class="col-sm-4"><input type="date" name="date_from" value="{{ request.GET.date_from }}" class="form-control"></div>
  <div class="col-sm-4"><input type="date" name="date_to" value="{{ request.GET.date_to }}" class="form-control"></div>
  <div class="col-sm-4"><button class="btn btn-outline-secondary w-100">Filter</button></div>
</form>
<div class="table-scroll">
<table class="table table-sm bg-white">
  <thead><tr><th>Category</th><th>Total</th></tr></thead>
  <tbody>
    {% for category, total in by_category %}
      <tr><td>{{ category }}</td><td>{{ total|ugx }}</td></tr>
    {% empty %}<tr><td colspan="2" class="text-muted">No data.</td></tr>{% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
